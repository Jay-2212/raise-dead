<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raise Dead: Graveyard of Lost Apps</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%230b1020' width='32' height='32'/%3E%3Cpath fill='%23d9f2ee' d='M8 6h16v2H8zm0 8h4v10H8zm6 0h4v10h-4zm6 0h4v10h-4z'/%3E%3C/svg%3E" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'" />
    <style>
      @font-face {
        font-family: 'Cinzel';
        src: url('./assets/fonts/Cinzel-VariableFont_wght.woff2') format('woff2');
        font-weight: 400 900;
        font-display: swap;
      }

      @font-face {
        font-family: 'Pixelify Sans';
        src: url('./assets/fonts/PixelifySans-VariableFont_wght.woff2') format('woff2');
        font-weight: 400 700;
        font-display: swap;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #0b1020;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        /* P0-6: Touch action none to prevent scrolling/zoom on joystick */
        touch-action: none;
      }

      #game-container {
        position: relative;
        /* P0-6: Use viewport dimensions instead of fixed px */
        width: 100vw;
        height: 100dvh;
      }

      #game-container canvas {
        display: block;
      }

      /* Loading screen before Phaser takes over */
      #loading-screen {
        position: absolute;
        inset: 0;
        background: #0b1020;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        color: #d9f2ee;
        font-family: 'Cinzel', serif;
        font-size: 1.2rem;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="loading-screen">Loading…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
