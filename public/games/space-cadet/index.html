  <style>/* Raise Dead: no remote original audio */ #start-btn-sound, #start-consent, .start-local, .start-check, #start-status { display: none !important; }</style>
<script>
/* Raise Dead: original WebAudio sound effects for Star Cadet (no Microsoft audio). */
(function(){
  var ac=null,master=null,last={};
  function ctx(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0.35;master.connect(ac.destination);}catch(e){return null}}if(ac.state==='suspended')ac.resume();return ac;}
  ['pointerdown','keydown','touchstart'].forEach(function(ev){window.addEventListener(ev,function(){ctx()},{capture:true,passive:true});});
  function tone(f,d,type,v,slide){var a=ctx();if(!a)return;var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v||0.3,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.02);}
  function noise(d,v,hp){var a=ctx();if(!a)return;var b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),x=b.getChannelData(0);for(var i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);var s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='highpass';f.frequency.value=hp||800;g.gain.value=v||0.3;s.buffer=b;s.connect(f);f.connect(g);g.connect(master);s.start();}
  var MAP={FLIP_UP:function(){noise(0.05,0.5,1500);tone(180,0.06,'square',0.15,90)},FLIP_DOWN:function(){noise(0.04,0.25,2500)},
    PLUNGER_RELEASE:function(){noise(0.12,0.4,400);tone(300,0.15,'sawtooth',0.15,900)},BALL_FEED:function(){tone(220,0.08,'triangle',0.2);setTimeout(function(){tone(330,0.1,'triangle',0.2)},70)},
    BUMPER:function(){tone(880,0.12,'square',0.22,440)},REBOUNDER:function(){tone(520,0.08,'square',0.2,300)},POPUP_HIT:function(){tone(660,0.07,'triangle',0.25)},
    KICKBACK:function(){noise(0.1,0.45,300);tone(120,0.2,'sawtooth',0.2,60)},ROLLOVER:function(){tone(1046,0.06,'sine',0.2)},ROLL_FUEL:function(){tone(784,0.05,'sine',0.2);setTimeout(function(){tone(1175,0.06,'sine',0.2)},50)},
    SPACEWARP:function(){tone(200,0.5,'sawtooth',0.18,1600)},KICKOUT:function(){noise(0.08,0.4,500);tone(400,0.1,'square',0.15,200)},SINK:function(){tone(500,0.4,'triangle',0.2,120)},
    NEW_GAME:function(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,0.12,'square',0.15)},i*90)})},TILT:function(){tone(110,0.6,'sawtooth',0.3,70)},
    BLOCKER_HIT:function(){tone(300,0.06,'square',0.2)},FLAG_TICK:function(){tone(1500,0.02,'square',0.08)}};
  window.__rdSynth=function(key){var n=performance.now();if(last[key]&&n-last[key]<35)return;last[key]=n;var fn=MAP[key];if(fn){fn();return;}if(/^SW/.test(key)){var h=0;for(var i=0;i<key.length;i++)h=(h*31+key.charCodeAt(i))%12;tone(440*Math.pow(2,h/12),0.12,'triangle',0.18);setTimeout(function(){tone(440*Math.pow(2,(h+7)/12),0.14,'triangle',0.15)},90);}};
})();
</script>

<body>
<div id="rd-help" style="position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:50;background:rgba(5,10,20,.88);color:#d9f2ee;border:1px solid #7fe0cf;border-radius:8px;padding:8px 14px;font:13px/1.5 Tahoma,sans-serif;text-align:center;pointer-events:none;transition:opacity .6s">
<b style="color:#7fe0cf">How to play</b> · <b>Z</b> or <b>←</b> left flipper · <b>/</b> or <b>→</b> right flipper · hold <b>Space</b> to pull the plunger, release to launch · <b>X</b> <b>.</b> nudge · tap left/right half on touch</div>
<script>
(function(){
  setTimeout(function(){var h=document.getElementById('rd-help');if(h)h.style.opacity='0';},12000);
  var MAP={ArrowLeft:'KeyZ',ShiftLeft:'KeyZ',ArrowRight:'Slash',ShiftRight:'Slash'};
  function relay(e){var c=MAP[e.code];if(!c||e.__rd)return;e.preventDefault();e.stopImmediatePropagation();var n=new KeyboardEvent(e.type,{code:c,key:c==='KeyZ'?'z':'/',bubbles:true,cancelable:true,repeat:e.repeat});n.__rd=1;(document.activeElement||document.body).dispatchEvent(n);}
  window.addEventListener('keydown',relay,true);window.addEventListener('keyup',relay,true);
})();
</script>

  <div id="app" class="app">
    <!-- UI fills: <ul class="menu-bar"> Game / Options / Help (ARCHITECTURE.md 8.2) -->

      <div id="stage" class="stage">
        <!-- main.js appends the Three.js canvas here (365:416 area at the left of the stage) -->

        <!-- UI fills: <canvas id="panel-canvas" width="203" height="394"> + visually-hidden live region #panel-aria -->
        <aside id="panel" class="panel" aria-label="Scoreboard"></aside>
        <!-- UI fills: buttons with [data-action] (touch devices only; see 8.7) -->
        <div id="touch-controls" class="touch-controls" hidden></div>
        <!-- UI fills: start / sound-consent card (SPEC 6.7) -->
        <div id="start-overlay" class="overlay start-overlay" hidden></div>
        <!-- UI fills: "sound: ..." status text and optional fps -->

      </div>
    </main>

    <!-- UI fills: modal dialogs (high scores, name entry, controls, about, help) -->
    <div id="dialog-root" class="dialog-root"></div>
    <!-- UI fills: transient messages -->
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
