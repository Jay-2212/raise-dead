<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Road Rash — risen (tribute)</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;color:#d9f2ee;font-family:monospace}canvas{display:block;width:100vw;height:100vh;touch-action:none}#ui{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:13px;pointer-events:none;background:rgba(11,16,32,.75);border-bottom:1px solid #7fe0cf}#btns{position:fixed;bottom:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 10px}#grp{display:flex;gap:10px}button{width:62px;height:62px;border-radius:50%;border:2px solid #7fe0cf;background:rgba(127,224,207,.15);color:#d9f2ee;font-size:22px;touch-action:none}#punch{background:rgba(201,185,138,.25);border-color:#c9b98a}</style></head><body>
<div id="ui"><span>Road Rash — risen (tribute)</span><span id="msg">Arrows/WASD ride • Space punch</span><span id="sc">0 • ♥3 • best 0</span></div>
<canvas id="c"></canvas>
<div id="btns"><div id="grp"><button id="L">◀</button><button id="R">▶</button></div><div id="grp"><button id="U">▲</button><button id="punch">✊</button></div></div>
<script>
let c=document.getElementById('c'),x=c.getContext('2d'),W,H,DPR,msg=document.getElementById('msg'),sc=document.getElementById('sc');
function rs(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);layout()}addEventListener('resize',rs);
let roadW,px,py,pw,ph,foes,parts,obst,state,t,score,best=0,lives,speed,spawnT,punchT,inv,keys={},acc=0,last=0,grace=2000,elapsed=0;
function layout(){roadW=Math.min(W*.8,H*.7);pw=roadW*.11;ph=H*.055;if(state==='play'){px=Math.min(Math.max(px,W/2-roadW/2,W/2+roadW/2-pw),W/2+roadW/2-pw);py=Math.min(Math.max(py,H*.4),H*.92)}}
function reset(){px=W/2-pw/2;py=H*.82;foes=[];parts=[];obst=[];state='ready';t=0;score=0;lives=3;speed=.004*W;spawnT=0;punchT=0;inv=0;elapsed=0;msg.textContent='Arrows/WASD ride • Space punch';upd()}
function upd(){sc.textContent=Math.floor(score)+' • ♥'+lives+' • best '+Math.floor(best)}
function laneX(i){let l=4;return W/2-roadW/2+roadW*(i+.5)/l-pw/2}
rs();reset();
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=1;if(e.key===' ')punch();if(e.key==='r'||e.key==='R'){if(state==='over')reset(),state='play'}if(state!=='play'&&(e.key===' '||e.key==='Enter'))start()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function start(){if(state==='play')return;if(state==='over')reset();state='play'}
c.addEventListener('pointerdown',e=>{if(state!=='play')start();else punch()});
function bind(id,k){let b=document.getElementById(id);let on=e=>{e.preventDefault();if(id==='punch')punch();else keys[k]=1;if(state!=='play')start()},off=e=>{e.preventDefault();keys[k]=0};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off)}
bind('L','arrowleft');bind('R','arrowright');bind('U','arrowup');
function punch(){if(state!=='play'||punchT>0)return;punchT=22;for(let f of foes){if(Math.abs(f.y-py)<H*.09&&Math.abs(f.x-px)<roadW*.22){f.hp--;f.vx=(f.x<px?-1:1)*.004*W;f.wob=20;if(f.hp<=0){f.dead=1;score+=150;burst(f.x,f.y,'#c9b98a')}else score+=25;break}}upd()}
function burst(bx,by,col){for(let i=0;i<10;i++)parts.push({x:bx,y:by,vx:(Math.random()-.5)*.4*H/60,vy:(Math.random()-.5)*.4*H/60,l:30,col})}
function spawn(dt){let easy=elapsed<15000?.5:Math.min(1.4,.5+elapsed/30000);spawnT-=dt;if(spawnT<=0){spawnT=(900+Math.random()*900)/easy;let l=Math.floor(Math.random()*4);foes.push({x:laneX(l),y:-H*.1,w:pw,h:ph,v:.0025*W*easy+Math.random()*.001*W,hp:2,vx:0,wob:0,dead:0,col:Math.random()<.5?'#e06a6a':'#8ab4ff'})}if(elapsed>8000&&Math.random()<dt/2200*easy){obst.push({x:W/2-roadW/2+Math.random()*(roadW-20),y:-30,w:Math.max(14,roadW*.08),h:14})}}
function step(dt){elapsed+=dt;if(elapsed<grace)return;let mv=.35*H/60*dt/16.7;if(keys['arrowleft']||keys['a'])px-=mv;if(keys['arrowright']||keys['d'])px+=mv;if(keys['arrowup']||keys['w'])py-=mv*.7;if(keys['arrowdown']||keys['s'])py+=mv*.7;px=Math.max(W/2-roadW/2,Math.min(W/2+roadW/2-pw,px));py=Math.max(H*.35,Math.min(H*.92,py));if(punchT>0)punchT-=dt/16.7;if(inv>0)inv-=dt;let dif=1+elapsed/45000;speed=(.004*W+.0015*W*Math.min(2,elapsed/30000));score+=dt*.02*dif;spawn(dt);
for(let f of foes){f.y+=(speed*.55+f.v)*dif*(dt/16.7);f.x+=f.vx*(dt/16.7);if(f.wob>0){f.wob-=dt/16.7;f.x+=Math.sin(f.wob)*2}if(!f.dead&&inv<=0&&Math.abs(f.x-px)<pw*.8&&Math.abs(f.y-py)<ph*.8){lives--;inv=1500;burst(px,py,'#7fe0cf');if(lives<=0){state='over';best=Math.max(best,score)}}if(f.dead)f.y+=.005*H;upd()}
foes=foes.filter(f=>f.y<H+80);for(let o of obst)o.y+=speed*dif*(dt/16.7);for(let o of obst){if(inv<=0&&px<o.x+o.w&&px+pw>o.x&&py<o.y+o.h&&py+ph>o.y){lives--;inv=1500;burst(px,py,'#7fe0cf');if(lives<=0)state='over';upd()}}obst=obst.filter(o=>o.y<H+40);for(let p of parts){p.x+=p.vx;p.y+=p.vy;p.l--}parts=parts.filter(p=>p.l>0);best=Math.max(best,score)}
function draw(moon){x.fillStyle='#0b1020';x.fillRect(0,0,W,H);x.fillStyle='#e8f4ff';x.globalAlpha=.9;x.beginPath();x.arc(W*.85,H*.12,H*.05,0,7);x.fill();x.globalAlpha=1;x.fillStyle='#0b1020';x.beginPath();x.arc(W*.85-H*.02,H*.10,H*.045,0,7);x.fill();
x.fillStyle='#131a30';for(let i=0;i<12;i++){let gx=(i*197)%W,gy=(i*131)%H;x.fillRect(gx,gy,3,8);x.fillStyle=i%2?'#1a2340':'#131a30'}
let rx=W/2-roadW/2;x.fillStyle='#232a45';x.fillRect(rx-10,0,roadW+20,H);x.fillStyle='#2e3654';x.fillRect(rx,0,roadW,H);x.strokeStyle='#c9b98a';x.setLineDash([12,12]);x.lineDashOffset=-t*.2;x.lineWidth=3;for(let i=1;i<4;i++){x.beginPath();x.moveTo(rx+roadW*i/4,0);x.lineTo(rx+roadW*i/4,H);x.stroke()}x.setLineDash([]);x.strokeStyle='#7fe0cf';x.strokeRect(rx-10,0,roadW+20,H);
for(let o of obst){x.fillStyle='#c9b98a';x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle='#0b1020';x.fillText('☠',o.x,o.y+12)}
for(let f of foes){drawBike(f.x,f.y,f.w,f.h,f.col,f.dead);if(f.wob>0){x.fillStyle='#d9f2ee';x.font='12px monospace';x.fillText('!',f.x+f.w/2,f.y-6)}}
drawBike(px,py,pw,ph,'#7fe0cf',false);if(punchT>0){x.strokeStyle='#c9b98a';x.lineWidth=3;x.beginPath();x.arc(px+pw/2,py,ph*(1.4-punchT*.02),0,7);x.stroke()}
for(let p of parts){x.fillStyle=p.col;x.fillRect(p.x,p.y,4,4)}
x.fillStyle='#d9f2ee';x.font=Math.max(12,H*.022)+'px monospace';x.textAlign='center';
if(state==='ready'){x.fillStyle='rgba(11,16,32,.7)';x.fillRect(0,H*.3,W,H*.3);x.fillStyle='#7fe0cf';x.fillText('ROAD RASH TRIBUTE',W/2,H*.4);x.fillStyle='#d9f2ee';x.fillText('Ready... Go! Punch rivals off!',W/2,H*.45);x.fillText('Tap / Space to start',W/2,H*.52)}
if(state==='over'){x.fillStyle='rgba(11,16,32,.8)';x.fillRect(0,H*.28,W,H*.36);x.fillStyle='#c9b98a';x.fillText('WRECKED',W/2,H*.38);x.fillStyle='#d9f2ee';x.fillText('Score '+Math.floor(score)+'  Best '+Math.floor(best),W/2,H*.45);x.fillText('Press R or tap to rise again',W/2,H*.52)}x.textAlign='left'}
function drawBike(bx,by,w,h,col,dead){x.save();x.translate(bx+w/2,by+h/2);if(dead)x.rotate(.6);x.fillStyle='#111';x.fillRect(-3,-h/2,6,h);x.fillStyle=col;x.beginPath();x.arc(0,-2,Math.max(5,w*.35),0,7);x.fill();x.fillRect(-w*.4,-h*.15,w*.8,h*.35);x.fillStyle='#0b1020';x.fillRect(-w*.4,h*.05,w*.8,3);x.restore()}
function loop(ts){requestAnimationFrame(loop);if(!last)last=ts;let d=Math.min(50,ts-last);last=ts;if(state==='play'){acc+=d;while(acc>=16.7){t++;step(16.7);acc-=16.7}}draw(ts)}
requestAnimationFrame(loop);
</script></body></html>
